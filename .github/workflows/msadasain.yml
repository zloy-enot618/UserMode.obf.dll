name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }} / ${{ matrix.configuration }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
        platform: [ x64, x86 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        working-directory: Source
        run: nuget restore "Basic Rootkit.sln"

      - name: Build
        working-directory: Source
        shell: pwsh
        run: >
          msbuild "Basic Rootkit.sln"
          /m
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.platform }}
          /p:PlatformToolset=v143
          /verbosity:minimal

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Basic-Rootkit-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            Source/bin/${{ matrix.platform }}/${{ matrix.configuration }}/**
            Source/${{ matrix.platform }}/${{ matrix.configuration }}/**
            Source/**/*.exe
            Source/**/*.dll
            Source/**/*.pdb
          if-no-files-found: error
